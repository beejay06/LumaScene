plugins { id 'com.android.application' }
android {
    namespace 'com.beejay.lumascene'
    compileSdk 34
    defaultConfig {
        applicationId 'com.beejay.lumascene'
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }
    def testKey = System.getenv('LUMASCENE_KEYSTORE')
    if (testKey) {
        signingConfigs.debug.storeFile = file(testKey)
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.zxing:core:3.5.3'
}
