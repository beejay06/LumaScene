name: Build LumaScene
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Test shuffle
        run: |
          mkdir -p /tmp/t
          javac -d /tmp/t app/src/main/java/com/beejay/lumascene/ShuffleBag.java test/ShuffleBagTest.java
          java -cp /tmp/t ShuffleBagTest
      # Keeps the same test signing key between builds, so updates install over the old app.
      # The key lives in GitHub's cache, never in this public repository.
      - uses: actions/cache@v4
        with: { path: ~/lumascene-test.keystore, key: lumascene-test-key-v1 }
      - name: Create the test key if there is none, and show its fingerprint
        run: |
          [ -f ~/lumascene-test.keystore ] || keytool -genkeypair -keystore ~/lumascene-test.keystore \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=LumaScene Test"
          keytool -list -v -keystore ~/lumascene-test.keystore -storepass android | grep SHA1
          echo "LUMASCENE_KEYSTORE=$HOME/lumascene-test.keystore" >> "$GITHUB_ENV"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk lumascene.apk
      - name: Publish download
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view test >/dev/null 2>&1 || gh release create test --title "LumaScene test build" --notes "Sideload lumascene.apk on the Shield."
          gh release upload test lumascene.apk --clobber
